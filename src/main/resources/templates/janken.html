<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>janken game</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <p>Hi! [[${entry.users}]]</p>

  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}">[[${user.name}]]</li>
  </ul>

  <h2>試合結果</h2>
  <li th:each="match : ${matches}">
    id:[[${match.id}]] user1:[[${match.user1}]] user2:[[${match.user2}]]
    user1の手:[[${match.user1Hand}]] user2の手:[[${match.user2Hand}]]
  </li>
  <div>
    <a th:href="@{/jankengame(hand='Gu')}">ぐー</a>
    <a th:href="@{/jankengame(hand='Choki')}">ちょき</a>
    <a th:href="@{/jankengame(hand='Pa')}">ぱー</a>
  </div>

  <div th:if="${userHand}">
    <div>あなたの手 <span th:text="${userHand}"></span></div>
    <div>相手の手 <span th:text="${cpuHand}"></span></div>
    <div>結果 <span th:text="${result}"></span></div>
  </div>
</body>

</html>

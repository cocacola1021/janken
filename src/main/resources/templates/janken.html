<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>janken game</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <p>エントリー</p>
  <ul>
    <li th:each="user : ${entry.users}">[[${user}]]</li>
  </ul>

  <p>Hi! [[${entry.users}]]</p>

  <div>
    <a th:href="@{/jankengame(hand='Gu')}">ぐー</a>
    <a th:href="@{/jankengame(hand='Choki')}">ちょき</a>
    <a th:href="@{/jankengame(hand='Pa')}">ぱー</a>
  </div>

  <div th:if="${userHand}">
    <div>あなたの手 <span th:text="${userHand}"></span></div>
    <div>相手の手 <span th:text="${cpuHand}"></span></div>
    <div>結果 <span th:text="${result}"></span></div>
  </div>
</body>

</html>

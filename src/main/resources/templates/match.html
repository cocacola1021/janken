<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>match game</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Match</h1>
  <h2>[[${login_user}]] V.S. [[${cpu.name}]]</h2>

  <div>
    <a th:href="@{/fight(id=${cpu.id},hand='Gu')}">ぐー</a>
    <a th:href="@{/fight(id=${cpu.id},hand='Choki')}">ちょき</a>
    <a th:href="@{/fight(id=${cpu.id},hand='Pa')}">ぱー</a>
  </div>

  <div th:if="${userHand}">
    <div>あなたの手 <span th:text="${userHand}"></span></div>
    <div>相手の手 <span th:text="${cpuHand}"></span></div>
    <div>結果 <span th:text="${result}"></span></div>
  </div>
  <a href="/janken">もどる</a>
</body>

</html>
